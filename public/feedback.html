<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Submit Feedback</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <div class="nav-brand">
                <h1>🎯 EventFeedback</h1>
            </div>
            <ul class="nav-menu">
                <li><a href="/">Home</a></li>
                <li><a href="/events.html">Events</a></li>
                <li><a href="/feedback.html" class="active">Feedback</a></li>
                <li><a href="/view-feedback.html">View Feedback</a></li>
            </ul>
        </div>
    </nav>

    <div class="feedback-form-container">
        <h2>📝 Share Your Feedback</h2>
        <p id="selectedEventHint" style="color: #667eea; margin-bottom: 15px;"></p>
        <div id="message"></div>
        <form id="feedbackForm">
            <div class="form-group">
                <label>Full Name *</label>
                <input type="text" id="fullName" required placeholder="Enter your full name">
            </div>
            <div class="form-group">
                <label>Email *</label>
                <input type="email" id="email" required placeholder="your@email.com">
            </div>
            <div class="form-group">
                <label>Event Name *</label>
                <select id="eventName" required>
                    <option value="">Select an event</option>
                    <option>Tech Conference 2024</option>
                    <option>Blockchain Summit</option>
                    <option>Web Development Workshop</option>
                </select>
            </div>
            <div class="form-group">
                <label>Rating *</label>
                <select id="rating" required>
                    <option value="">Select rating</option>
                    <option value="5">⭐⭐⭐⭐⭐ - Excellent</option>
                    <option value="4">⭐⭐⭐⭐ - Very Good</option>
                    <option value="3">⭐⭐⭐ - Good</option>
                    <option value="2">⭐⭐ - Fair</option>
                    <option value="1">⭐ - Poor</option>
                </select>
            </div>
            <div class="form-group">
                <label>Your Feedback *</label>
                <textarea id="feedback" rows="5" required placeholder="Share your experience..."></textarea>
            </div>
            <button type="submit" class="submit-btn">Submit Feedback</button>
        </form>
    </div>

    <footer>
        <div class="container">
            <p>&copy; 2024 Sysslan IT Solutions. All rights reserved.</p>
        </div>
    </footer>
    
    <script src="js/feedback.js"></script>
</body>
</html>
